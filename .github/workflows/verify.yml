name: Controller verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned verification dependencies
        run: python3 -m pip install -r requirements-controller.txt
      - name: Run controller tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Verify root-owned locking and real Docker image retention
        run: sudo env RETENTION_DISPOSABLE_DOCKER=1 python3 -B -m unittest discover -s tests -p 'test_image_maintenance*.py' -v
