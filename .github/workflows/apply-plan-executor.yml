name: Apply approved deployment plan executor
on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      environment:
        required: true
        type: string
      plan_id:
        required: true
        type: string
    outputs:
      operation_id:
        value: ${{ jobs.apply.outputs.operation_id }}
      plan_digest:
        value: ${{ jobs.apply.outputs.plan_digest }}
      source_commit:
        value: ${{ jobs.apply.outputs.source_commit }}
      image:
        value: ${{ jobs.apply.outputs.image }}
      deployment_outcome:
        value: ${{ jobs.apply.outputs.deployment_outcome }}
      migration_outcome:
        value: ${{ jobs.apply.outputs.migration_outcome }}
      backup_id:
        value: ${{ jobs.apply.outputs.backup_id }}
      report_artifact:
        value: ${{ jobs.apply.outputs.report_artifact }}
      activation_decision:
        value: ${{ jobs.apply.outputs.activation_decision }}
      next_action:
        value: ${{ jobs.apply.outputs.next_action }}
    secrets:
      DEPLOY_SSH_PRIVATE_KEY:
        required: true
      DEPLOY_SSH_HOST_KEY:
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  apply:
    outputs:
      operation_id: ${{ steps.operation.outputs.operation_id }}
      plan_digest: ${{ steps.operation.outputs.plan_digest }}
      source_commit: ${{ steps.operation.outputs.source_commit }}
      image: ${{ steps.operation.outputs.image }}
      deployment_outcome: ${{ steps.operation.outputs.deployment_outcome }}
      migration_outcome: ${{ steps.operation.outputs.migration_outcome }}
      backup_id: ${{ steps.operation.outputs.backup_id }}
      report_artifact: ${{ steps.operation.outputs.report_artifact }}
      activation_decision: ${{ steps.operation.outputs.activation_decision }}
      next_action: ${{ steps.operation.outputs.next_action }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Uniwares-LTD/infrastructure
          ref: db0d885b020bcfebf8fd69fbc536b65965f0767f
      - name: Apply the exact approved plan
        id: operation
        env:
          PROJECT: ${{ inputs.project }}
          TARGET: ${{ inputs.environment }}
          PLAN_ID: ${{ inputs.plan_id }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: python3 scripts/apply-plan-client.py "$PROJECT" "$TARGET" "$PLAN_ID"

      - name: Retain available data-operation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: data-operation-report
          path: ${{ runner.temp }}/data-operation-report.json
          if-no-files-found: ignore
